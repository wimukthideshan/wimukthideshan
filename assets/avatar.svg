<svg viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated cartoon of Deshan typing on a laptop">
  <defs>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c83ff"/>
      <stop offset="100%" stop-color="#b57bff"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#b57bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b57bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c83ff"/>
      <stop offset="100%" stop-color="#ff8ac2"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="200" cy="190" r="165" fill="url(#bg)">
    <animate attributeName="r" values="160;172;160" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- floating symbols -->
  <g font-family="'Courier New', monospace" font-size="26" font-weight="700">
    <text x="62" y="130" fill="#7c83ff" opacity="0.8">{ }
      <animate attributeName="y" values="130;116;130" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="150" fill="#ff8ac2" opacity="0.8">%
      <animate attributeName="y" values="150;164;150" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="52" y="250" fill="#b57bff" opacity="0.8">&#963;
      <animate attributeName="y" values="250;238;250" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="344" y="262" fill="#7c83ff" opacity="0.8">$
      <animate attributeName="y" values="262;248;262" dur="3.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- character -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4s" repeatCount="indefinite"/>

    <!-- hoodie -->
    <path d="M105 335 Q105 250 200 244 Q295 250 295 335 Z" fill="url(#hood)"/>
    <!-- neck -->
    <rect x="185" y="224" width="30" height="26" rx="8" fill="#d9a07a"/>
    <!-- ears -->
    <circle cx="149" cy="196" r="9" fill="#d9a07a"/>
    <circle cx="251" cy="196" r="9" fill="#d9a07a"/>
    <!-- head -->
    <circle cx="200" cy="190" r="52" fill="#e0aa84"/>
    <!-- hair -->
    <path d="M148 184 Q146 132 200 130 Q254 132 252 184 Q236 156 200 156 Q164 156 148 184 Z" fill="#1c1b2b"/>
    <!-- headphones -->
    <path d="M144 190 Q142 124 200 124 Q258 124 256 190" fill="none" stroke="#3a3f55" stroke-width="7" stroke-linecap="round"/>
    <rect x="134" y="180" width="16" height="32" rx="7" fill="#7c83ff"/>
    <rect x="250" y="180" width="16" height="32" rx="7" fill="#7c83ff"/>
    <!-- eyes (blink) -->
    <ellipse cx="180" cy="194" rx="5" ry="6" fill="#1c1b2b">
      <animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="220" cy="194" rx="5" ry="6" fill="#1c1b2b">
      <animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- brows -->
    <path d="M172 180 Q180 175 188 179" stroke="#1c1b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M212 179 Q220 175 228 180" stroke="#1c1b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M186 213 Q200 225 214 213" stroke="#1c1b2b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="170" cy="210" r="6" fill="#ff8ac2" opacity="0.35"/>
    <circle cx="230" cy="210" r="6" fill="#ff8ac2" opacity="0.35"/>

    <!-- laptop lid (back view) -->
    <rect x="125" y="262" width="150" height="46" rx="8" fill="#2b2f45"/>
    <circle cx="200" cy="285" r="8" fill="url(#logo)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="108" y="308" width="184" height="9" rx="4" fill="#3a3f55"/>

    <!-- typing hands -->
    <circle cx="160" cy="318" r="10" fill="#e0aa84">
      <animate attributeName="cy" values="318;313;318;318" keyTimes="0;0.25;0.5;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="318" r="10" fill="#e0aa84">
      <animate attributeName="cy" values="318;318;313;318" keyTimes="0;0.5;0.75;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- thought bubble -->
  <g>
    <circle cx="262" cy="96" r="5" fill="#8b949e" fill-opacity="0.25"/>
    <circle cx="276" cy="80" r="8" fill="#8b949e" fill-opacity="0.25"/>
    <rect x="262" y="28" width="150" height="44" rx="18" fill="#8b949e" fill-opacity="0.15" stroke="#8b949e" stroke-opacity="0.45"/>
    <g font-family="'Courier New', monospace" font-size="14" fill="#8b949e" text-anchor="middle">
      <text x="337" y="55" opacity="0">loss.backward()
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="337" y="55" opacity="0">TAM / SAM / SOM
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
