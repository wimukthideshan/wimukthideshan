<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hey, I'm Deshan">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c83ff"/>
      <stop offset="50%" stop-color="#b57bff"/>
      <stop offset="100%" stop-color="#ff8ac2"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c83ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8ac2" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c83ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff8ac2" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="220"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <circle cx="150" cy="60" r="5" fill="#7c83ff" opacity="0.5">
      <animate attributeName="cy" values="60;46;60" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="80" r="4" fill="#ff8ac2" opacity="0.6">
      <animate attributeName="cy" values="80;96;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="36" r="3" fill="#b57bff" opacity="0.6">
      <animate attributeName="cy" values="36;26;36" dur="4s" repeatCount="indefinite"/>
    </circle>

    <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#g)" letter-spacing="-1">
      hey, I'm Deshan
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8b949e" text-anchor="middle">
      <text x="450" y="136" opacity="0">training models, questioning business models
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.25;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="136" opacity="0">ML nerd with a product habit
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="136" opacity="0">great model, but who pays for it?
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="136" opacity="0">will debug for snacks
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <path fill="url(#w2)" d="M0 180 C 150 152, 300 208, 450 180 S 750 152, 900 180 S 1200 208, 1350 180 S 1650 152, 1800 180 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#w1)" d="M0 196 C 150 176, 300 214, 450 196 S 750 176, 900 196 S 1200 214, 1350 196 S 1650 176, 1800 196 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
