<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart meme: how an ML project really goes, mostly cleaning data and explaining it to people">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c83ff"/>
      <stop offset="100%" stop-color="#ff8ac2"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .track { fill: #8b949e; fill-opacity: 0.12; }
  </style>

  <text class="t" x="450" y="34" font-size="22" font-weight="700" text-anchor="middle">how an ML project actually goes</text>

  <!-- Row 1 -->
  <text class="t" x="30" y="92" font-size="17">cleaning the data</text>
  <rect class="track" x="260" y="72" width="560" height="26" rx="13"/>
  <rect x="260" y="72" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" values="0;0;390;390;0" keyTimes="0;0.05;0.3;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text class="t" x="835" y="92" font-size="15">70%</text>

  <!-- Row 2 -->
  <text class="t" x="30" y="144" font-size="17">explaining it to people</text>
  <rect class="track" x="260" y="124" width="560" height="26" rx="13"/>
  <rect x="260" y="124" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" values="0;0;0;170;170;0" keyTimes="0;0.05;0.15;0.4;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text class="t" x="835" y="144" font-size="15">25%</text>

  <!-- Row 3 -->
  <text class="t" x="30" y="196" font-size="17">tuning hyperparameters</text>
  <rect class="track" x="260" y="176" width="560" height="26" rx="13"/>
  <rect x="260" y="176" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" values="0;0;0;0;40;40;0" keyTimes="0;0.05;0.15;0.25;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text class="t" x="835" y="196" font-size="15">4%</text>

  <!-- Row 4 -->
  <text class="t" x="30" y="248" font-size="17">the cool model part</text>
  <rect class="track" x="260" y="228" width="560" height="26" rx="13"/>
  <rect x="260" y="228" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" values="0;0;0;0;0;8;8;0" keyTimes="0;0.05;0.15;0.25;0.35;0.6;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text class="t" x="835" y="248" font-size="15">1%</text>

  <text class="t" x="450" y="285" font-size="13" text-anchor="middle" fill-opacity="0.7">(figures extremely scientific)</text>
</svg>
