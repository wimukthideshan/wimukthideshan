<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meme: model in my notebook versus model in the real world">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c83ff"/>
      <stop offset="100%" stop-color="#ff8ac2"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
    .cap { font-size: 20px; font-weight: 700; }
    .big { font-size: 46px; font-weight: 800; fill: url(#mg); }
    .small { font-size: 17px; }
    .panel { fill: #8b949e; fill-opacity: 0.08; stroke: #8b949e; stroke-opacity: 0.35; stroke-width: 1.5; }
    .shake { animation: shake 2.2s infinite; transform-origin: 675px 170px; }
    @keyframes shake { 0%, 60%, 100% { transform: rotate(0deg); } 65% { transform: rotate(-2deg); } 70% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } 80% { transform: rotate(0deg); } }
    .pop { animation: pop 3s infinite; transform-origin: 225px 170px; }
    @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>

  <rect class="panel" x="10" y="10" width="430" height="310" rx="16"/>
  <rect class="panel" x="460" y="10" width="430" height="310" rx="16"/>

  <text class="t cap" x="225" y="55">my model, in my notebook</text>
  <g class="pop">
    <text class="t big" x="225" y="170">99.9%</text>
    <text class="t small" x="225" y="205">accuracy. flawless. genius.</text>
  </g>
  <text class="t" font-size="42" x="225" y="275">&#128640;</text>

  <text class="t cap" x="675" y="55">my model, in the real world</text>
  <g class="shake">
    <text class="t big" x="675" y="170">cat</text>
    <text class="t small" x="675" y="205">it says everything is a cat.</text>
  </g>
  <text class="t" font-size="42" x="675" y="275">&#128576;</text>
</svg>
